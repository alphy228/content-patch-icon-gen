<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alphy's stuff — content patch to icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<style>
  :root{
    --roman: "Cinzel", "Trajan Pro", "Times New Roman", serif;
    --book: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  }
  *{ box-sizing: border-box; }
  html{ background: #fff; color: #000; }
  body{ margin: 0 auto; max-width: 820px; padding: 72px 28px 56px; font: 500 20px/1.5 var(--book); text-align: center; }
  h1{ font: 800 clamp(40px, 8vw, 68px)/1.05 var(--roman); letter-spacing: .06em; margin: 0; }
  .sub{ font: italic 500 26px/1.3 var(--book); margin: 10px 0 0; }
  .rule{ width: 120px; border: 0; border-top: 1px solid #000; margin: 36px auto; }
  .button{
    display: inline-block; cursor: pointer; user-select: none; color: #000; background: #fff; text-decoration: none;
    font: 600 17px/1 var(--roman); letter-spacing: .14em; text-transform: lowercase;
    border: 1px solid #000; padding: 14px 30px 15px;
  }
  .button:focus-visible{ background: #000; color: #fff; }
  @media (hover: hover){ .button:hover{ background: #000; color: #fff; } }  /* phones: no sticky hover after a tap */
  .button[aria-disabled="true"]{ cursor: progress; background: #fff; color: #000; opacity: .4; }
  #error{ font-style: italic; margin: 18px 0 0; }
  #out{ margin-top: 8px; }
  pre{ display: inline-block; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; font: 15px/1.45 ui-monospace, Menlo, Consolas, monospace; margin: 0 0 8px; }
  .item{ margin: 0 0 44px; }
  .item h2{ font: 600 19px/1.2 var(--roman); letter-spacing: .08em; margin: 0 0 14px; word-break: break-word; }
  .row{ display: flex; justify-content: center; align-items: flex-end; gap: 36px; flex-wrap: wrap; }
  .warn{ font: italic 500 17px/1.4 var(--book); max-width: 640px; margin: -6px auto 14px; overflow-wrap: anywhere; }
  .warn p{ margin: 0 0 4px; }
  figure{ margin: 0; }
  figure img{ display: block; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; }
  figcaption{ font: italic 500 16px var(--book); margin-top: 6px; }
  footer{ margin-top: 56px; font: italic 500 18px var(--book); }
  body.drag{ outline: 1px solid #000; outline-offset: -14px; }
</style>
</head>
<body>

<h1>alphy's stuff</h1>
<p class="sub">content patch to icons</p>
<hr class="rule">

<label class="button" id="pick" for="file" aria-disabled="true">loading…</label>
<input type="file" id="file" accept=".zip,application/zip" hidden disabled>
<p id="error" hidden></p>

<div id="out" hidden>
  <hr class="rule">
  <a class="button" id="download" download="icons.zip" href="#">download</a>
  <hr class="rule">
  <div id="patchbox" hidden><pre id="patch"></pre><hr class="rule"></div>
  <div id="general" class="warn" hidden></div>
  <div id="items"></div>
</div>

<footer>slop coded in alphy's basement</footer>

<script type="module">
const $ = id => document.getElementById(id);
//CheerpJ wants a plain path: location.pathname is URL-encoded ("%20"), CheerpJ would encode it again ("%2520")
const base = "/app" + decodeURIComponent(location.pathname.replace(/[^/]*$/, ""));
let Web = null, busy = false, urls = [];

function state(label, ready){
  $("pick").textContent = label;
  $("pick").setAttribute("aria-disabled", String(!ready));
  $("file").disabled = !ready;
}
//Java exceptions from CheerpJ are not plain JS errors (String(e) throws)
async function describe(e){
  try{ if(e && typeof e.getMessage === "function"){ const m = await e.getMessage(); const c = await (await e.getClass()).getName(); return m ? c + ": " + m : c; } }catch(_){}
  try{ if(e && e.message) return e.message; }catch(_){}
  try{ return String(e); }catch(_){}
  return "unknown error (see the browser console)";
}
function fail(message){
  $("error").textContent = message;
  $("error").hidden = false;
}

async function start(){
  if(location.protocol === "file:"){
    state("unavailable", false);
    fail("opened from disk; browsers block that. run  python3 serve.py  in this folder, or put it on github pages");
    return;
  }
  try{
    await cheerpjInit({ version: 17, status: "none" });
    const lib = await cheerpjRunLibrary(base + "icongen.jar:" + base + "mindustry.jar");
    Web = await lib.rvsb.icongen.Web;
    const r = await Web.init(base + "sprites", "/files/icongen");
    if(r !== "ok") throw new Error(r);
    state("import zip", true);
  }catch(e){
    console.error(e);
    state("unavailable", false);
    fail(await describe(e));
  }
}

async function run(file){
  if(!Web || busy) return;
  busy = true;
  state("working…", false);
  $("error").hidden = true;
  try{
    const r = JSON.parse(await Web.run(new Int8Array(await file.arrayBuffer())));
    if(r.error){
      console.log(r.log);
      $("out").hidden = true;
      fail(r.error);
      return;
    }
    console.log(r.log);
    await show(r);
  }catch(e){
    console.error(e);
    fail(await describe(e));
  }finally{
    busy = false;
    state("import zip", true);
    $("file").value = "";
  }
}

const blobUrl = (bytes, type) => {
  const url = URL.createObjectURL(new Blob([new Uint8Array(bytes)], { type }));
  urls.push(url);
  return url;
};

async function show(r){
  urls.forEach(u => URL.revokeObjectURL(u));
  urls = [];
  $("download").href = blobUrl(await Web.zip(), "application/zip");
  $("patchbox").hidden = !r.patch;
  $("patch").textContent = r.patch;

  //"warning: <content>: <text>" lines of the log, shown under their item (the rest above the items)
  const warnings = new Map(), general = [];
  for(const line of r.log.split("\n")){
    const m = /^warning: (?:([\w-]+): )?(.*)$/.exec(line);
    if(!m) continue;
    if(m[1] && r.items.some(it => it.name === m[1])){
      if(!warnings.has(m[1])) warnings.set(m[1], []);
      warnings.get(m[1]).push(m[2]);
    }else general.push(m[1] ? m[1] + ": " + m[2] : m[2]);
  }
  const warnBox = (el, list) => {
    el.textContent = "";
    for(const text of list){
      const p = document.createElement("p");
      p.textContent = text;
      el.append(p);
    }
  };
  warnBox($("general"), general);
  $("general").hidden = !general.length;

  const items = $("items");
  items.textContent = "";
  for(const item of r.items){
    const el = document.createElement("section");
    el.className = "item";
    const h = document.createElement("h2");
    h.textContent = item.name.replace(/^dp-/, "");
    const row = document.createElement("div");
    row.className = "row";
    for(let i = 0; i < r.outputs.length; i++){
      const o = r.outputs[i];
      if(o.content !== item.name) continue;
      const img = document.createElement("img");
      img.src = blobUrl(await Web.file(i), "image/png");
      //small sprites: whole-number zoom; huge ones: fit
      const big = Math.max(o.width, o.height);
      const scale = big <= 64 ? Math.min(4, Math.floor(160 / big)) : Math.min(1, 300 / o.width, 300 / o.height);
      img.width = Math.round(o.width * scale);
      img.height = Math.round(o.height * scale);
      img.alt = img.title = o.path;
      const cap = document.createElement("figcaption");
      cap.textContent = o.kind === "uiIcon" ? "ui" : "full";
      const fig = document.createElement("figure");
      fig.append(img, cap);
      row.append(fig);
    }
    el.append(h);
    if(warnings.has(item.name)){
      const w = document.createElement("div");
      w.className = "warn";
      warnBox(w, warnings.get(item.name));
      el.append(w);
    }
    el.append(row);
    items.append(el);
  }
  $("out").hidden = false;
}

$("file").addEventListener("change", e => { if(e.target.files[0]) run(e.target.files[0]); });
let depth = 0;
addEventListener("dragenter", e => { e.preventDefault(); if(++depth === 1 && Web && !busy) document.body.classList.add("drag"); });
addEventListener("dragleave", () => { if(--depth <= 0){ depth = 0; document.body.classList.remove("drag"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault(); depth = 0; document.body.classList.remove("drag");
  if(e.dataTransfer.files[0]) run(e.dataTransfer.files[0]);
});

start();
</script>
</body>
</html>
